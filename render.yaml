services:
  - type: web
    name: casonpower-line-command
    runtime: python
    plan: free
    buildCommand: pip install -r src/requirements.txt
    startCommand: python src/server.py
    healthCheckPath: /health
    envVars:
      - key: LINE_CHANNEL_ACCESS_TOKEN
        sync: false
      - key: LINE_CHANNEL_SECRET
        sync: false
      - key: CASON_DEVICE_TOKEN
        sync: false
      - key: CASON_DUPLICATE_BLOCK_SECONDS
        value: "300"
      - key: CASON_DEFAULT_DEVICE_ID
        value: "CASON-0001"
      - key: CASON_TIMEZONE
        value: "Asia/Bangkok"
      - key: CASON_HEARTBEAT_TIMEOUT_SECONDS
        value: "300"
      - key: CASON_HEARTBEAT_CHECK_INTERVAL_SECONDS
        value: "30"
      - key: CASON_WATCHDOG_ALERT_COOLDOWN_SECONDS
        value: "1800"
      - key: CASON_WATCHDOG_RETRY_BASE_SECONDS
        value: "60"
      - key: CASON_WATCHDOG_MAX_RETRIES
        value: "3"
